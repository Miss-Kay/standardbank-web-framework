name: OIDC debug (temporary)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | python3 -c '
import sys,json
c=json.load(sys.stdin)
for k in ("sub","aud","iss","repository","repository_owner","ref"):
    print(f"{k} = {c.get(k)}")
'
